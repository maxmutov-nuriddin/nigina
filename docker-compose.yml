# Lokal/serverda ishga tushirish: docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nigina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nigina}
      POSTGRES_DB: nigina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nigina -d nigina"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ talabi: kalitlar o'chirilmasin
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    environment:
      # .env'da DATABASE_URL bo'lsa (masalan Supabase) — o'sha, bo'lmasa shu compose'dagi postgres
      DATABASE_URL: ${DATABASE_URL:-postgresql://nigina:${POSTGRES_PASSWORD:-nigina}@postgres:5432/nigina?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      # .env'da DATABASE_URL bo'lsa (masalan Supabase) — o'sha, bo'lmasa shu compose'dagi postgres
      DATABASE_URL: ${DATABASE_URL:-postgresql://nigina:${POSTGRES_PASSWORD:-nigina}@postgres:5432/nigina?schema=public}
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
      TMP_DIR: /app/tmp
    volumes:
      - storage:/app/storage
    # /health, /health/ready (uptime monitor) va webhook rejimida /telegram/webhook
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
